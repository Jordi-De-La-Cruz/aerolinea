<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - Destinos Mundiales</title>
    <link rel="icon" href="img/inicial.jpg" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forgotPassword.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="forgot-page">

        <button class="back-btn" id="backBtn" aria-label="Volver atrás">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </button>

        <div class="forgot-container">
            <div class="forgot-header">
                <div class="forgot-logo">
                    <img src="img/mundo.png" alt="Logo Destinos Mundiales" />
                    <h1>Destinos<br />Mundiales</h1>
                </div>
                <p class="forgot-subtitle">Ingresa tu correo para restablecer la contraseña</p>
            </div>

            <form class="forgot-form" id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email" class="visually-hidden">Correo electrónico</label>
                    <input type="email" id="email" class="form-input" placeholder="Correo electrónico" required
                        autocomplete="email" aria-describedby="email-error" />
                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                    <span id="email-error" class="error-message" role="alert" hidden></span>
                </div>

                <button type="submit" class="btn-forgot">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i> Enviar enlace
                </button>

                <div class="forgot-back-link">
                    <a href="login.html">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>

    </div>

    <script src="js/main.js"></script>
    <script src="js/forgotPassword.js"></script>
</body>

</html>
